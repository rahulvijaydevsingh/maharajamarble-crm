name: Verified ZIP-Only Backup Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verified-zip-only-cleanup.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which Supabase project to clean after deploying the ZIP-only code"
        required: true
        type: choice
        options:
          - production
          - preview
      dry_run:
        description: "Preview and verify archives without deleting raw table files"
        required: true
        type: boolean
        default: true
      limit:
        description: "Maximum number of completed jobs in one invocation (1–20)"
        required: false
        type: number
        default: 5

jobs:
  verify-and-clean-raw-backup-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned ZIP verifier dependency
        run: npm install --no-save --package-lock=false --legacy-peer-deps jszip@3.10.1

# Execute approved Production ZIP cleanup in bounded five-job batches after full dry-run verification.
      - name: Verify ZIPs on runner and optionally remove raw exports
        env:
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'production' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || (contains(github.event.head_commit.message, '[execute-production-backup-cleanup]') && 'false' || 'true') }}
          JOB_LIMIT: ${{ github.event_name == 'workflow_dispatch' && (inputs.limit || 5) || 5 }}
          PROD_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          PROD_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROD_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PREVIEW_PROJECT_ID: ${{ secrets.PREVIEW_SUPABASE_PROJECT_ID }}
          PREVIEW_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
          PREVIEW_CRON_SECRET: ${{ secrets.PREVIEW_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            PROJECT_ID="$PROD_PROJECT_ID"
            SERVICE_ROLE_KEY="$PROD_SERVICE_ROLE_KEY"
            CRON_SECRET="$PROD_CRON_SECRET"
          else
            PROJECT_ID="$PREVIEW_PROJECT_ID"
            SERVICE_ROLE_KEY="$PREVIEW_SERVICE_ROLE_KEY"
            CRON_SECRET="$PREVIEW_CRON_SECRET"
          fi
          export PROJECT_ID SERVICE_ROLE_KEY CRON_SECRET DRY_RUN JOB_LIMIT
          node scripts/verified-zip-only-cleanup.mjs
